name: Deploy web staging

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Commit SHA or tag to deploy
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: web-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy approved staging release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Verify before deployment
        run: |
          dart format --output=none --set-exit-if-changed lib test tool
          flutter analyze
          flutter test
      - name: Build connected staging web release
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_WEB_VAPID_KEY: ${{ secrets.FIREBASE_WEB_VAPID_KEY }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
          APPLE_SUBSCRIPTION_MANAGEMENT_URL: ${{ vars.APPLE_SUBSCRIPTION_MANAGEMENT_URL }}
          GOOGLE_PLAY_SUBSCRIPTION_MANAGEMENT_URL: ${{ vars.GOOGLE_PLAY_SUBSCRIPTION_MANAGEMENT_URL }}
        run: >-
          flutter build web --release
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY"
          --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID"
          --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID"
          --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID"
          --dart-define=FIREBASE_WEB_VAPID_KEY="$FIREBASE_WEB_VAPID_KEY"
          --dart-define=PUBLIC_APP_URL="$PUBLIC_APP_URL"
          --dart-define=APPLE_SUBSCRIPTION_MANAGEMENT_URL="$APPLE_SUBSCRIPTION_MANAGEMENT_URL"
          --dart-define=GOOGLE_PLAY_SUBSCRIPTION_MANAGEMENT_URL="$GOOGLE_PLAY_SUBSCRIPTION_MANAGEMENT_URL"
      - name: Audit deployable artifact
        run: dart run tool/release_audit.dart
      - name: Deploy to Cloudflare Pages staging branch
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=staging --commit-dirty=true
