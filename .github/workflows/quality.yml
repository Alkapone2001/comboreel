name: Quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter, security, and web artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --reporter expanded
      - name: Build optimized web release
        run: flutter build web --release
      - name: Audit release and store artifacts
        run: |
          dart run tool/release_audit.dart
          dart run tool/store_audit.dart
      - name: Upload immutable web artifact
        uses: actions/upload-artifact@v6
        with:
          name: comboreel-web-${{ github.sha }}
          path: build/web
          if-no-files-found: error
          retention-days: 14

  database:
    name: PostgreSQL migrations and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7
      - name: Bootstrap Supabase-compatible roles
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
      - name: Apply migrations in order
        shell: bash
        run: |
          set -euo pipefail
          for migration in $(find supabase/migrations -maxdepth 1 -name '*.sql' | sort); do
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Run SQL contracts
        shell: bash
        run: |
          set -euo pipefail
          for contract in $(find supabase/tests -maxdepth 1 -name '*_contract.sql' | sort); do
            echo "Testing $contract"
            psql -v ON_ERROR_STOP=1 -f "$contract"
          done

  android:
    name: Signed Android release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Generate isolated CI signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/comboreel-ci.jks" \
            -storepass comboreel-ci -keypass comboreel-ci \
            -alias comboreel-ci -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=ComboReel CI, O=ComboReel, C=US"
          cat > android/key.properties <<EOF
          storePassword=comboreel-ci
          keyPassword=comboreel-ci
          keyAlias=comboreel-ci
          storeFile=$RUNNER_TEMP/comboreel-ci.jks
          EOF
      - name: Build signed release APK and App Bundle
        run: |
          flutter build apk --release
          flutter build appbundle --release
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: comboreel-android-ci-signed-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  ios:
    name: Unsigned iOS release application
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build release application without store signing
        run: flutter build ios --release --no-codesign
      - name: Validate iOS application metadata
        shell: bash
        run: |
          set -euo pipefail
          APP="build/ios/iphoneos/Runner.app"
          test -d "$APP"
          plutil -lint "$APP/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "com.comboreel.comboreel"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$APP/Info.plist")" = "comboreel"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")" = "15.0"
      - name: Upload unsigned iOS application
        uses: actions/upload-artifact@v6
        with:
          name: comboreel-ios-unsigned-${{ github.sha }}
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 14
